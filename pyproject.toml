[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=84.2.1" ]

[project]
name = "axis-batch"
version = "1.0.0"
description = "Divide an array into batches along specific axes in NumPy / PyTorch / JAX"
readme = "README.md"
license = "MIT"
authors = [
  { name = "34j" },
]
requires-python = ">=3.13"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "array-api-compat>=1.11.2",
]
urls."Bug Tracker" = "https://github.com/34j/axis-batch/issues"
urls.Changelog = "https://github.com/34j/axis-batch/blob/main/CHANGELOG.md"
urls.documentation = "https://axis-batch.readthedocs.io"
urls.repository = "https://github.com/34j/axis-batch"

[dependency-groups]
dev = [
  "coverage",
  "numpy>=2.2",
  "packaging-34j[test]>=1.1.7",
  "ty",
]
docs = [
  "packaging-34j[docs]",
]

[tool.ruff]
extend = ".venv/ruff.toml"

[tool.pyproject-fmt]
max_supported_python = "3.14"

[tool.ty]
terminal.error-on-warning = true
